# Configuração do CLIENTE Firebird dentro da imagem Docker (lida pelo libfbclient
# via variável FIREBIRD=/app/docker). Motivo: o servidor é Firebird 2.5 e o
# cliente do Debian é 3.x; o firebird.conf que o pacote instala em
# /etc/firebird/3.0 é o do SERVIDOR, com WireCrypt = Required, e o cliente lê
# o mesmo arquivo. O 2.5 não tem criptografia de protocolo, então a conexão
# volta "SQLCODE -923 connection rejected by remote interface".
#
# Enabled = usa criptografia se o servidor tiver, senão segue sem.
WireCrypt = Enabled
# Autenticação legada (SYSDBA/masterkey do 2.5) precisa estar na lista.
AuthClient = Srp256, Srp, Legacy_Auth
